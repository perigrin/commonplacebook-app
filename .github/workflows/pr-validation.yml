name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Template App/**'
      - 'Template AppTests/**'
      - 'Template AppUITests/**'
      - '*.xcodeproj/**'
      - '.github/workflows/**'

jobs:
  build:
    name: Build and Validate
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Install dependencies
        run: |
          gem install xcpretty
          gem install cocoapods
          pod install --repo-update
        
      - name: Build for iOS
        run: |
          set -o pipefail
          xcodebuild clean build -workspace "Template App.xcworkspace" -scheme "Template App" -destination "platform=iOS Simulator,name=iPhone 14" | xcpretty
        
      - name: SwiftLint
        run: |
          if which swiftlint >/dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
            brew install swiftlint
            swiftlint
          fi
        
      - name: Run Tests
        run: |
          set -o pipefail
          xcodebuild test -workspace "Template App.xcworkspace" -scheme "Template App" -destination "platform=iOS Simulator,name=iPhone 14" | xcpretty
        
      - name: Gather Code Coverage
        run: |
          set -o pipefail
          xcodebuild test -workspace "Template App.xcworkspace" -scheme "Template App" -destination "platform=iOS Simulator,name=iPhone 14" -enableCodeCoverage YES | xcpretty
        
      - name: Upload Code Coverage Report
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          xcode: true
          xcode_derived_data: ./DerivedData
          fail_ci_if_error: false
