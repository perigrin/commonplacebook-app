name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Commonplace Book/**'
      - 'Commonplace BookTests/**'
      - 'Commonplace BookUITests/**'
      - '*.xcodeproj/**'
      - '.github/workflows/**'

jobs:
  build:
    name: Build and Validate
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install dependencies
        run: |
          gem install xcpretty

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "Commonplace Book.xcodeproj" \
            -scheme "Commonplace Book"
        
      - name: Build for iOS
        run: |
          set -o pipefail
          xcodebuild clean build -project "Commonplace Book.xcodeproj" -scheme "Commonplace Book" -destination "platform=iOS Simulator,name=iPhone 16,OS=18.0" | xcpretty
        
      - name: SwiftLint
        run: |
          if which swiftlint >/dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
            brew install swiftlint
            swiftlint
          fi
        
      - name: Run Tests
        run: |
          set -o pipefail
          xcodebuild test -project "Commonplace Book.xcodeproj" -scheme "Commonplace Book" -destination "platform=iOS Simulator,name=iPhone 16,OS=18.0" | xcpretty
        
      - name: Gather Code Coverage
        run: |
          set -o pipefail
          xcodebuild test -project "Commonplace Book.xcodeproj" -scheme "Commonplace Book" -destination "platform=iOS Simulator,name=iPhone 16,OS=18.0" -enableCodeCoverage YES | xcpretty
        
      - name: Upload Code Coverage Report
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          xcode: true
          xcode_derived_data: ./DerivedData
          fail_ci_if_error: false
