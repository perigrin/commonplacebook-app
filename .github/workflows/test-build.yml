name: Test Build

on:
  pull_request:
    paths:
      - 'Commonplace Book/**'
      - 'Commonplace BookTests/**'
      - 'Commonplace BookUITests/**'
      - '*.xcodeproj/**'
      - '.github/workflows/**'
      - 'Package.swift'

jobs:
  test-ios-build:
    name: Test iOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "Commonplace Book.xcodeproj" \
            -scheme "Commonplace Book"

      - name: Install iOS Platform
        run: |
          xcodebuild -downloadPlatform iOS

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project "Commonplace Book.xcodeproj" \
            -scheme "Commonplace Book" \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Run SwiftLint
        run: |
          if which swiftlint >/dev/null; then
            swiftlint lint --strict
          else
            brew install swiftlint
            swiftlint lint --strict
          fi
        continue-on-error: true

  # NOTE: macOS build temporarily disabled due to swift-embeddings xcframework
  # conflict causing "Multiple commands produce module.modulemap" error.
  # See: https://github.com/jkrukowski/swift-embeddings/issues
  # The sentencepiece.xcframework has duplicate module.modulemap files.
  # iOS build works correctly.
