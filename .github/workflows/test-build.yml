name: Test Build

on:
  push:
    branches:
      - '**'  # Run on all branches
    paths:
      - 'Commonplace Book/**'
      - 'Commonplace BookTests/**'
      - 'Commonplace BookUITests/**'
      - '*.xcodeproj/**'
      - '.github/workflows/**'
      - 'Package.swift'
  pull_request:
    paths:
      - 'Commonplace Book/**'
      - 'Commonplace BookTests/**'
      - 'Commonplace BookUITests/**'
      - '*.xcodeproj/**'
      - '.github/workflows/**'
      - 'Package.swift'

jobs:
  test-ios-build:
    name: Test iOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "Commonplace Book.xcodeproj" \
            -scheme "Commonplace Book"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project "Commonplace Book.xcodeproj" \
            -scheme "Commonplace Book" \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=26.0.1" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Run SwiftLint
        run: |
          if which swiftlint >/dev/null; then
            swiftlint lint --strict
          else
            brew install swiftlint
            swiftlint lint --strict
          fi
        continue-on-error: true

  test-macos-build:
    name: Test macOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "Commonplace Book.xcodeproj" \
            -scheme "Commonplace Book"

      - name: Build for macOS
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project "Commonplace Book.xcodeproj" \
            -scheme "Commonplace Book" \
            -destination "platform=macOS,arch=arm64" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
