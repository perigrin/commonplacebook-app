name: Test Build

on:
  pull_request:
    paths:
      - 'Commonplace Book/**'
      - 'Commonplace BookTests/**'
      - 'Commonplace BookUITests/**'
      - '*.xcodeproj/**'
      - '.github/workflows/**'
      - 'Package.swift'

jobs:
  test-ios-build:
    name: Test iOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Clear SPM cache
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf .build
          rm -rf "Commonplace Book.xcodeproj/project.xcworkspace/xcshareddata/swiftpm"
          mkdir -p "Commonplace Book.xcodeproj/project.xcworkspace/xcshareddata/swiftpm"
          cp Package.resolved "Commonplace Book.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "Commonplace Book.xcodeproj" \
            -scheme "Commonplace Book" \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Install iOS Platform
        run: |
          xcodebuild -downloadPlatform iOS

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project "Commonplace Book.xcodeproj" \
            -scheme "Commonplace Book" \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Run SwiftLint
        run: |
          if which swiftlint >/dev/null; then
            swiftlint lint --strict
          else
            brew install swiftlint
            swiftlint lint --strict
          fi
        continue-on-error: true

  test-macos-build:
    name: Test macOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Clear SPM cache
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf .build
          rm -rf "Commonplace Book.xcodeproj/project.xcworkspace/xcshareddata/swiftpm"
          mkdir -p "Commonplace Book.xcodeproj/project.xcworkspace/xcshareddata/swiftpm"
          cp Package.resolved "Commonplace Book.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "Commonplace Book.xcodeproj" \
            -scheme "Commonplace Book" \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Build for macOS
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project "Commonplace Book.xcodeproj" \
            -scheme "Commonplace Book" \
            -destination "platform=macOS,arch=arm64" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
